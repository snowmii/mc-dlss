# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_kotlin_version=1.13.13+kotlin.2.4.10

# Mod Properties
mod_version=1.0.0
maven_group=me.snowmii

# Dependencies
fabric_api_version=0.156.0+26.2

# runClient-only mods. Not shipped, not compiled against - they exist to test the mod against
# a realistic client. Set a version to empty to drop that mod from the run.
modmenu_version=20.0.1
sodium_version=mc26.2-0.9.2-alpha.4-fabric
devauth_version=1.2.2
